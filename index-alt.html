<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Υπολογιστής Αμοιβής Φωτισμού</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #1f2937;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    h1 {
      color: #fbbf24;
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 24px;
    }
    label {
      display: block;
      color: #9ca3af;
      font-size: 0.875rem;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, select {
      width: 100%;
      padding: 12px 16px;
      background: #374151;
      border: 1px solid #4b5563;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #fbbf24;
    }
    .checkbox-wrapper {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }
    .checkbox-wrapper input {
      width: auto;
      margin: 0 10px 0 0;
    }
    .checkbox-wrapper label {
      margin: 0;
      color: #d1d5db;
    }
    .results {
      background: #111827;
      border-radius: 12px;
      padding: 20px;
      margin-top: 8px;
      display: none;
    }
    .results.show { display: block; }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 0.9rem;
    }
    .row-label { color: #9ca3af; }
    .row-value { color: white; font-weight: 500; }
    .warning {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.3);
      color: #fbbf24;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin: 12px 0;
    }
    .total {
      border-top: 1px solid #374151;
      margin-top: 12px;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total-label { color: #fbbf24; font-size: 1.1rem; font-weight: 700; }
    .total-value { color: #fbbf24; font-size: 1.3rem; font-weight: 700; }
    .categories {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #374151;
    }
    .categories h3 {
      color: #6b7280;
      font-size: 0.75rem;
      margin-bottom: 10px;
      font-weight: 600;
    }
    .categories ul {
      list-style: none;
      color: #6b7280;
      font-size: 0.75rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💡 Υπολογιστής Αμοιβής Φωτισμού</h1>
    
    <label for="sqm">Τετραγωνικά (m²)</label>
    <input type="number" id="sqm" placeholder="π.χ. 5000" oninput="calculate()">
    
    <label for="level">Επίπεδο Εμπειρίας</label>
    <select id="level" onchange="calculate()">
      <option value="Junior">Junior (28–35€/ώρα)</option>
      <option value="Mid-level" selected>Mid-level (38–50€/ώρα)</option>
      <option value="Senior">Senior (55–75€/ώρα)</option>
    </select>
    
    <div class="checkbox-wrapper">
      <input type="checkbox" id="minimum" checked onchange="calculate()">
      <label for="minimum">Εφαρμογή ελάχιστου τέλους</label>
    </div>
    
    <div class="results" id="results">
      <div class="row">
        <span class="row-label">Κατηγορία Έργου:</span>
        <span class="row-value" id="category"></span>
      </div>
      <div class="row">
        <span class="row-label">Τιμή ανά m²:</span>
        <span class="row-value" id="rate"></span>
      </div>
      <div class="row">
        <span class="row-label">Υπολογισμός:</span>
        <span class="row-value" id="calc"></span>
      </div>
      <div class="warning" id="warning" style="display:none">
        ⚠️ Εφαρμόζεται το ελάχιστο τέλος
      </div>
      <div class="total">
        <span class="total-label">Τελική Αμοιβή:</span>
        <span class="total-value" id="total"></span>
      </div>
    </div>
    
    <div class="categories">
      <h3>Κατηγορίες Έργων:</h3>
      <ul>
        <li>• Μικρό: &lt; 2.000 m²</li>
        <li>• Μεσαίο: 2.000–10.000 m²</li>
        <li>• Μεγάλο: 10.000–50.000 m²</li>
        <li>• Πολύ Μεγάλο: &gt; 50.000 m²</li>
      </ul>
    </div>
  </div>

  <script>
    const rates = {
      'Μικρό': { 'Junior': 5, 'Mid-level': 7, 'Senior': 10.5 },
      'Μεσαίο': { 'Junior': 3.15, 'Mid-level': 4.4, 'Senior': 6.5 },
      'Μεγάλο': { 'Junior': 1.9, 'Mid-level': 2.65, 'Senior': 3.9 },
      'Πολύ Μεγάλο': { 'Junior': 1.1, 'Mid-level': 1.55, 'Senior': 2.3 }
    };
    const minimums = { 'Junior': 1500, 'Mid-level': 2500, 'Senior': 3500 };

    function getCategory(m2) {
      if (m2 < 2000) return 'Μικρό';
      if (m2 < 10000) return 'Μεσαίο';
      if (m2 < 50000) return 'Μεγάλο';
      return 'Πολύ Μεγάλο';
    }

    function formatNum(n) {
      return n.toLocaleString('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function calculate() {
      const sqm = parseFloat(document.getElementById('sqm').value) || 0;
      const level = document.getElementById('level').value;
      const applyMin = document.getElementById('minimum').checked;
      const resultsDiv = document.getElementById('results');

      if (sqm <= 0) {
        resultsDiv.classList.remove('show');
        return;
      }

      const category = getCategory(sqm);
      const rate = rates[category][level];
      const calculated = sqm * rate;
      const min = minimums[level];
      const final = applyMin ? Math.max(calculated, min) : calculated;
      const minApplied = applyMin && calculated < min;

      document.getElementById('category').textContent = category;
      document.getElementById('rate').textContent = rate.toFixed(2) + '€';
      document.getElementById('calc').textContent = sqm.toLocaleString('el-GR') + ' × ' + rate.toFixed(2) + '€ = ' + formatNum(calculated) + '€';
      document.getElementById('warning').style.display = minApplied ? 'block' : 'none';
      document.getElementById('warning').textContent = '⚠️ Εφαρμόζεται το ελάχιστο τέλος (' + min.toLocaleString('el-GR') + '€)';
      document.getElementById('total').textContent = formatNum(final) + '€';
      resultsDiv.classList.add('show');
    }
  </script>
</body>
</html>
